<div class="h-screen flex w-full bg-[#0b0f19] text-white font-sans overflow-hidden">
    <!-- Sol Taraf - Görsel -->
    <div class="hidden lg:block w-1/2 h-full relative border-r border-white/5">
        <app-auth-visual></app-auth-visual>
    </div>

    <!-- Sağ Taraf - Form -->
    <div class="w-full lg:w-1/2 relative flex items-center justify-center p-6 overflow-hidden">
        <!-- Mobile background gradient -->
        <div class="absolute inset-0 bg-linear-to-br from-indigo-900/10 to-purple-900/10 lg:hidden pointer-events-none">
        </div>

        <div class="w-full max-w-100 flex flex-col justify-center z-10">
            <!-- Geri Dön Butonu -->
            <div class="mb-8">
                <a routerLink="/login"
                    class="flex items-center text-sm text-gray-400 hover:text-white transition-colors group w-max">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-4 h-4 mr-2 group-hover:-translate-x-1 transition-transform">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    Giriş Sayfasına Dön
                </a>
            </div>

            <div class="mb-8 ">
                <h2 class="text-3xl font-extrabold text-[#f9fafb] mb-2 tracking-wide" style="font-family: 'Montserrat'">
                    Parolanızı mı unuttunuz?
                </h2>
                <p class="text-gray-400 text-sm">
                    Endişelenmeyin! E-posta adresinizi girin, size sıfırlama bağlantısı gönderelim.
                </p>
            </div>

            <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <!-- E-Posta -->
                <app-form-input id="email" type="email" label="E-Posta" placeholder="ornek@email.com"
                    formControlName="email" [control]="emailControl"
                    errorMessage="Geçerli bir e-posta adresi giriniz."></app-form-input>

                <!-- Success Message -->
                <div *ngIf="successMessage"
                    class="text-green-400 text-sm text-center bg-green-500/10 p-4 rounded-lg border border-green-500/20 flex items-start justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5 mt-0.5 shrink-0">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>{{ successMessage }}</span>
                </div>

                <div class="pt-2">
                    <app-primary-button [disabled]="forgotPasswordForm.invalid || isLoading" [isLoading]="isLoading">
                        Sıfırlama Bağlantısı Gönder
                    </app-primary-button>
                </div>
            </form>

        </div>

        <div
            class="absolute bottom-6 w-full flex justify-center gap-6 text-[10px] text-gray-500/60 uppercase tracking-widest font-medium z-20">
            <a href="#" class="hover:text-indigo-400 transition-colors">Destek</a>
        </div>
    </div>
</div>
