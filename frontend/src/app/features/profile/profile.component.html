<!-- Wrapper to safely allow Fixed Modal -->
<div>
    <div class="min-h-screen text-white font-['Inter'] relative overflow-hidden flex items-center justify-center p-6">

        <!-- Background Effects -->
        <div class="absolute inset-0 pointer-events-none">
            <div
                class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,var(--tw-gradient-stops))] from-indigo-900/20 to-transparent">
            </div>
            <div class="absolute bottom-0 right-0 w-1/3 h-1/3 bg-purple-900/10 blur-[100px] rounded-full"></div>
        </div>

        <!-- Profile Card -->
        <div
            class="relative z-10 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden group bg-white/5 transition-all duration-500">


            <!-- Animated Gradient Background (Hover Effect) -->
            <div
                class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[300%] aspect-square bg-[conic-gradient(from_180deg_at_50%_50%,#1e1b4b_0%,#4f46e5_50%,#1e1b4b_100%)] animate-[spin_4s_linear_infinite] opacity-0 group-hover:opacity-100 transition-opacity duration-500">
            </div>

            <div
                class="relative flex flex-col md:flex-row h-auto max-h-[85vh] bg-[#161b2c] rounded-[15px] m-[1px] overflow-hidden">

                <!-- Sidebar / User Info -->
                <div
                    class="w-full md:w-1/3 bg-[#0b0f19]/50 border-b md:border-b-0 md:border-r border-white/5 p-8 flex flex-col items-center justify-center text-center relative group">
                    <!-- Avatar Glow -->
                    <div
                        class="absolute w-full h-1/2 top-0 bg-indigo-600/10 blur-[60px] rounded-full pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-700">
                    </div>

                    <div
                        class="relative w-24 h-24 mb-6 bg-linear-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg shadow-indigo-500/30 ring-4 ring-[#161b2c]">
                        <span class="text-4xl font-bold text-white uppercase">
                            {{ displayName().charAt(0) }}
                        </span>
                    </div>

                    <h2 class="text-xl font-bold text-white mb-1">{{ displayName() }}</h2>
                    <p class="text-sm text-gray-400 mb-8">{{ user()?.email }}</p>

                    <div class="w-full mt-auto">
                        <button (click)="onLogout()"
                            class="flex w-full items-center justify-center gap-2 rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-400 hover:bg-red-500 hover:text-white hover:cursor-pointer transition-all duration-200">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                            </svg>
                            Oturumu Kapat
                        </button>
                    </div>
                </div>

                <!-- Settings Form -->
                <div class="w-full md:w-2/3 p-8 md:p-12 overflow-y-auto">
                    <div class="mb-8">
                        <h1 class="text-2xl font-bold text-white mb-2">Profil Ayarları</h1>
                        <p class="text-gray-400 text-sm">Hesap bilgilerinizi ve güvenlik tercihlerinizi buradan
                            yönetebilirsiniz.</p>
                    </div>

                    <form [formGroup]="profileForm" (ngSubmit)="onSave()" class="space-y-8">

                        <!-- Account Section -->
                        <div class="space-y-5">
                            <h3
                                class="text-sm font-semibold text-indigo-400 uppercase tracking-widest border-b border-white/5 pb-2 mb-4">
                                Hesap Bilgileri</h3>

                            <app-form-input id="email" type="email" label="E-Posta Adresi" placeholder="ornek@email.com"
                                formControlName="email" [control]="emailControl"
                                errorMessage="Geçerli bir e-posta adresi giriniz."></app-form-input>
                        </div>

                        <!-- Security Section -->
                        <div class="space-y-5">
                            <h3
                                class="text-sm font-semibold text-indigo-400 uppercase tracking-widest border-b border-white/5 pb-2 mb-4">
                                Güvenlik</h3>

                            <!-- 2FA Toggle -->
                            <div
                                class="flex items-center justify-between p-4 mb-6 bg-white/5 rounded-xl border border-white/5">
                                <div>
                                    <h4 class="text-white font-semibold">2 Adımlı Doğrulama (2FA)</h4>
                                    <p class="text-xs text-gray-400 mt-1">Hesabınızı ekstra güvenlik katmanıyla koruyun.
                                    </p>
                                </div>

                                <app-toggle-switch [checked]="user()?.two_factor_enabled || false" srLabel="2FA Durumu"
                                    (changed)="onToggle2FA()">
                                </app-toggle-switch>
                            </div>


                            <app-form-input id="currentPassword" type="password" label="Mevcut Parola"
                                placeholder="********" formControlName="currentPassword"
                                [control]="currentPasswordControl"
                                errorMessage="Değişiklikleri kaydetmek için mevcut parolanızı girmelisiniz."></app-form-input>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <app-form-input id="newPassword" type="password" label="Yeni Parola"
                                    placeholder="********" formControlName="newPassword" [control]="newPasswordControl"
                                    errorMessage="En az 8 karakter." [showPasswordStrength]="true"></app-form-input>

                                <app-form-input id="confirmNewPassword" type="password" label="Yeni Parola Tekrar"
                                    placeholder="********" formControlName="confirmNewPassword"
                                    [control]="confirmNewPasswordControl"></app-form-input>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-4 pt-4">
                            <div class="w-full sm:w-auto min-w-37.5">
                                <app-primary-button [disabled]="profileForm.invalid"
                                    [isLoading]="isSaving">Kaydet</app-primary-button>
                            </div>

                            <!-- Success Message -->
                            <span *ngIf="successMessage" class="text-green-400 text-sm font-medium animate-pulse">
                                {{ successMessage }}
                            </span>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <app-confirmation-modal [isOpen]="isModalOpen" [title]="modalTitle" [message]="modalMessage" [type]="modalType"
        confirmText="Evet, Onayla" cancelText="Vazgeç" (confirm)="confirmModal()" (cancel)="closeModal()">
    </app-confirmation-modal>
</div>
