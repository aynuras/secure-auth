<div *ngIf="isOpen"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto overflow-x-hidden transition-all">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity" (click)="onCancel()"></div>

    <!-- Modal Content -->
    <div
        class="relative w-full max-w-md transform overflow-hidden rounded-2xl bg-[#161b2c] border border-white/10 p-6 text-left shadow-xl transition-all sm:my-8 scale-100 opacity-100">

        <!-- Header / Icon -->
        <div class="flex flex-col items-center justify-center mb-5">
            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-indigo-500/10 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="h-6 w-6 text-indigo-400">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" *ngIf="type === 'success'" />
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
                        *ngIf="type === 'warning'" />
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"
                        *ngIf="type === 'info'" />
                </svg>
            </div>
            <h3 class="text-xl font-bold leading-6 text-white text-center font-['Inter']" id="modal-title">{{ title }}
            </h3>
        </div>

        <!-- Body -->
        <div class="mt-2 mb-6">
            <p class="text-sm text-gray-400 text-center">
                {{ message }}
            </p>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 justify-center">
            <button type="button"
                class="inline-flex w-full justify-center rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-white/10 sm:w-auto min-w-[100px] transition-colors cursor-pointer"
                (click)="onCancel()">
                {{ cancelText }}
            </button>
            <button type="button"
                class="inline-flex w-full justify-center rounded-lg px-3 py-2.5 text-sm font-semibold text-white shadow-sm sm:w-auto min-w-[100px] transition-all hover:opacity-90 active:scale-95 cursor-pointer"
                [ngClass]="{
                    'bg-indigo-600 hover:bg-indigo-500': type !== 'danger',
                    'bg-red-600 hover:bg-red-500': type === 'danger'
                }" (click)="onConfirm()">
                {{ confirmText }}
            </button>
        </div>
    </div>
</div>
