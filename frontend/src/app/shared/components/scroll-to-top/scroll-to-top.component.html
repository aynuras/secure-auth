<button *ngIf="isVisible" (click)="scrollToTop()" class="fixed bottom-8 right-8 z-50 p-3 bg-indigo-600 text-white rounded-full 
         shadow-lg cursor-pointer transition-all duration-300 hover:bg-indigo-500 
         hover:shadow-[0_0_20px_rgba(79,70,229,0.5)] transform hover:scale-110" [class.opacity-0]="!isVisible"
    [class.opacity-100]="isVisible" [class.translate-y-10]="!isVisible" [class.translate-y-0]="isVisible">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
    </svg>
</button>
