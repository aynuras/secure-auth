<div class="relative w-full max-w-125 h-100">

    <!-- Card 1: Secure Storage (Top Left) -->
    <div class="absolute top-10 left-0 animate-float-slow z-20">
        <div class="glass-card py-3 px-5 rounded-xl flex items-center gap-4 min-w-[260px]">
            <div class="w-10 h-10 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
            </div>
            <div class="flex flex-col">
                <div class="text-white text-sm font-semibold whitespace-nowrap">Secure Storage</div>
                <div class="text-slate-400 text-xs whitespace-nowrap">HttpOnly & SameSite</div>
            </div>
        </div>
    </div>

    <!-- Card 2: Argon2 Hashing (Center Right) -->
    <div class="absolute top-1/2 -right-12 lg:-right-18 -translate-y-1/2 z-30">
        <div class="glass-card py-4 px-6 rounded-xl flex items-center gap-4 min-w-[320px] animate-float-medium">
            <div
                class="w-12 h-12 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0">
                <!-- Key/Hash Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
                </svg>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-white text-sm font-semibold truncate">Secure Hashing</span>
                    <span
                        class="px-2 py-0.5 rounded bg-indigo-500/20 border border-indigo-500/30 text-[10px] text-indigo-300 font-medium">Argon2</span>
                </div>
                <!-- Progress bar decoration -->
                <div class="w-full bg-slate-700/50 h-1 rounded-full overflow-hidden mb-1.5">
                    <div class="bg-indigo-500 h-full w-[85%] rounded-full shadow-[0_0_10px_rgba(99,102,241,0.5)]"></div>
                </div>
                <div class="text-slate-400 text-[11px] truncate">Memory-hard password protection</div>
            </div>
        </div>
    </div>

    <!-- Card 3: Performance (Bottom Left) -->
    <div class="absolute bottom-10 left-6 animate-float-fast z-10">
        <div class="glass-card py-3 px-5 rounded-xl flex items-center gap-4 min-w-[240px]">
            <div
                class="w-10 h-10 rounded-full bg-orange-500/20 flex items-center justify-center text-orange-400 shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                </svg>
            </div>
            <div class="flex flex-col">
                <div class="text-white text-sm font-semibold whitespace-nowrap">Real-time Guard</div>
                <div class="text-slate-400 text-xs whitespace-nowrap">Active Monitoring</div>
            </div>
        </div>
    </div>

    <!-- Abstract Connecting Lines (Optional decorative SVGs background) -->
    <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-20" style="z-index: 0;">
        <path d="M100 100 Q 250 200 400 150" stroke="url(#gradient)" stroke-width="2" fill="none"
            stroke-dasharray="5,5" />
        <path d="M150 300 Q 300 250 450 200" stroke="white" stroke-width="1" fill="none" opacity="0.3" />
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>
