<button type="button" (click)="onToggle()"
    class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[#0b0f19] cursor-pointer"
    [ngClass]="checked ? 'bg-indigo-600' : 'bg-gray-700'">
    <span class="sr-only">{{ srLabel }}</span>
    <span class="inline-block h-4 w-4 transform rounded-full bg-white transition duration-200 ease-in-out"
        [ngClass]="checked ? 'translate-x-6' : 'translate-x-1'"></span>
</button>
